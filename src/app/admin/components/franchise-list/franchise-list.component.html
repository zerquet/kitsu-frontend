<div>
  <h5>Manage Franchises</h5>
  <div id="admin-search-section">
    <div id="add-btn-section"><button type="button" routerLink="../add/franchise"><i class="bi bi-plus-square"></i> Add Franchise</button></div>
    <form [formGroup]="form">
      <input id="admin-search-field" type="text" formControlName="searchControl" placeholder="Search for franchises...">
    </form>
  </div>
  <div class="admin-table">
    <div class="admin-head">
      <div class="title-cell">Franchise</div>
      <div class="actions-cell">Actions</div>
    </div>
    <div class="admin-body">
      @if(filteredSearchList$ | async; as searchList) {
        @for(franchise of searchList; track franchise.id) {
          <div class="admin-row" routerLink="{{franchise.id}}">
            <div class="title-cell">{{franchise.name}}</div>
            <div class="actions-cell">
              <!-- <span routerLink="{{franchise.id}}" class="me-1 cursor">
                <i class="bi bi-pencil-fill"></i>
              </span> -->
              <span (click)="deleteFranchise(franchise.id!)" class="ms-1 cursor delete-anime"><i class="bi bi-trash3"></i></span>
            </div>
          </div>
        }
      }
    </div>
  </div>
</div>
