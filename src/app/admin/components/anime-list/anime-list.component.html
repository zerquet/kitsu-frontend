<div>
  <h5>Manage Animes</h5>
  <div id="admin-search-section">
    <div id="add-btn-section"><button type="button" routerLink="../add/anime"><i class="bi bi-plus-square"></i> Add Anime</button></div>
    <form [formGroup]="form">
      <input id="admin-search-field" type="text" formControlName="searchControl" placeholder="Search for anime...">
    </form>
  </div>
  <div class="admin-table">
    <div class="admin-head">
      <div class="image-cell">Image</div>
      <div class="title-cell">Title</div>
      <div class="year-cell">Year</div>
      <div class="type-cell">Type</div>
      <div class="epCount-cell">Eps. </div>
      <div class="actions-cell">Actions</div>
    </div>
    <div class="admin-body">
      @if(filteredSearchList$ | async; as searchList) {
        @for(anime of searchList; track anime.id) {
          <div class="admin-row" routerLink="{{anime.id}}">
            <div class="image-cell"><div><img src="{{environment.imageHostUrl}}/{{anime.imageUrl}}"></div></div>
            <div class="title-cell">{{anime.title}}</div>
            <div class="year-cell">{{anime.year}}</div>
            <div class="type-cell">{{anime.details.mediaType}}</div>
            <div class="epCount-cell">{{anime.details.episodeCount}}</div>
            <div class="actions-cell">
              <span routerLink="{{anime.id}}" class="me-1 cursor">
                <i class="bi bi-pencil-fill"></i>
              </span>
              <span (click)="deleteAnime(anime.id)" class="ms-1 cursor delete-anime"><i class="bi bi-trash3"></i></span>
            </div>
          </div>
        }
      }
    </div>
  </div>
</div>
