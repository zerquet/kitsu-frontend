<div class="container">
  <div [ngClass]="{'tab-left-pad' : scootRight }" class="anime-tabs"> <!--make tabs compnoent, pass callback to handle custom click events, think react-->
    <ul>
      @for (tab of tabs; track tab) {
        @if (tab.routeUrl) {
          <a [routerLink]="tab.routeUrl" routerLinkActive="active" [class.no-bottom-border]="!hasBottomBorder" class="tab-item">
            <li>
              {{tab.label | titlecase}}
            </li>
          </a>
        }
        @else {
          <li [class.active]="activeTabId === tab.id" [class.no-bottom-border]="!hasBottomBorder" (click)="tabClicked.emit(tab.id)" class="tab-item">
            {{tab.label | titlecase}}
          </li>
        }
      }
    </ul>
  </div>
</div>
