@if (libraryEntry$.value !== null) {
  <div id="editModalTitle">
    <h4>{{libraryEntry$.value.animeInfo?.title}}</h4>
    <span id="closeModal">
      <i class="bi bi-x" (click)="closeModal()"></i>
    </span>
  </div>
  <div id="editEntryModalContainer">
    <form [formGroup]="form">
      @if(userProfile$ | async; as user) {
        <div class="flex">
          <div><label for="status">Library Status</label></div>
          <div>
            <select formControlName="status" id="status" [disabled]="authService.loggedUserId$.getValue() !== user.id">
              <option value="completed">Completed</option>
              <option value="watching">Currently Watching</option>
              <option value="planning">Want to Watch</option>
            </select>
          </div>
        </div>

        <div class="flex">
          <div><label for="progress">Progress</label></div>
          <div>
            <input formControlName="progress" type="number" id="progress" 
              [max]="libraryEntry$.value.animeInfo?.episodeCount!" min="0" [value]="libraryEntry$.value.episodesWatched" 
              [disabled]="authService.loggedUserId$.getValue() !== user.id"
              [readonly]="authService.loggedUserId$.getValue() !== user.id">
            <span> of {{libraryEntry$.value.animeInfo?.episodeCount}} episodes</span>
          </div>
        </div>

        <div class="flex">
          <div><label for="rating">Rating</label></div>
          <div>
            <select formControlName="rating" id="rating" [disabled]="authService.loggedUserId$.getValue() !== user.id">
              <option value="">-</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="10">10</option>
            </select>
          </div>
        </div>
        
        @if(authService.loggedUserId$.getValue() === user.id) {   
          <div class="flex">
            <div><button id="removeFromLibraryBtn" type="button" (click)="deleteEntry()"><i class="bi bi-trash3"></i></button></div>
            <div><input type="button" value="Save Changes" [disabled]="form.valid" (click)="saveChanges()" class="save"></div>
          </div>
        }
      }
    </form>
  </div>
}
