@if (profileInfo$ | async; as profileInfo) {
  @if (profileInfo !== null) {
    <div id="modal-cover-photo"></div>
    <div id="anime-tabs-container" class="container">
      <div id="anime-tabs">
        <ul>
          <li (click)="currentTab = 'about'" [ngClass]="{'active' : currentTab === 'about'}">About Me</li>
          <li (click)="currentTab = 'favorites'" [ngClass]="{'active' : currentTab === 'favorites'}">Favorites</li>
        </ul>
      </div>
    </div>
    <div>
      @if (currentTab === 'about') {
        <form [formGroup]="form" (ngSubmit)="null">
          <div><h4>About Me</h4></div>
          <div class="field-section">
            <label for="location">Location</label>
            <input formControlName="location" type="text" id="location">
          </div>
          <div class="field-section">
            <label for="birthday">Birthday</label>
            <input formControlName="birthday" type="date" id="birthday">
          </div>
          <div class="field-section">
            <label for="gender">Gender</label>
            <select id="gender" formControlName="gender">
              <option value="Secret">It's a secret</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="field-section">
            <label for="bio">Bio</label>
            <textarea formControlName="bio" id="bio"></textarea>
          </div>
          <div id="btn-section"><input type="button" value="Update Profile" (click)="saveChanges()"></div>
        </form>
      }
      @else if (currentTab === 'favorites') {
        <manage-favorites [parentModelRef]="activeModal"></manage-favorites> 
      }
    </div>
  }
}
