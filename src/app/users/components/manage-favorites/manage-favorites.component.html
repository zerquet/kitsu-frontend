<div id="favorites-section">
  <h4>Favorites</h4>
  <form [formGroup]="form">
    <div id="search-section">
      <input formControlName="search" type="text" placeholder="Start typing to search">
      @if (showResults === true) {
        <div class="minimalistic-dropdown open">
          <div class="results-scroller">
            @if (searchResults$ | async; as results) {
              @for(anime of results; track anime.id) {
                <div (click)="addFavorite(anime)" class="results-item"><strong>{{anime.title}}</strong></div>
              }
            }
          </div>
        </div>
      }
      <div></div>
    </div>
    <div>
      @if (newList$ | async; as favorites) {
        @for(favorite of favorites; track favorite.id) {
          <div class="favorite-record-container">
            <div class="favorite-info-section">
              <div class="favorite-photo-section">
                <a routerLink="/anime/{{favorite.id}}/summary" href="javascript:void(0);">
                  <img src="{{environment.imageHostUrl}}/anime/poster/{{favorite.imageUrl}}" />
                </a>
              </div>
              <div class="favorite-title-section">
                <span>{{favorite.title}}</span>
              </div>
            </div>
            <div class="favorite-remove-section">
              <a 
                (click)="removeFavorite(favorite)" 
                ngbTooltip="Remove Favorite?" 
                placement="start" 
                href="javascript:void(0);"
              >
                <i class="bi bi-x-circle"></i>
              </a>
            </div>
          </div>
        }          
      }
    </div>
  </form>
</div>
