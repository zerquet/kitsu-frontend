<div class="container">
  <div class="reaction-container">
    @if (userProfile$.value !== null) {
      @if(mediaReaction$ | async; as reaction) {
        <div>
          <reaction-card [reaction]="reaction"></reaction-card>
          <div class="users-reactions-container">
            <a 
              href="javascript:void(0);" 
              class="users-reactions"
              routerLink="/users/{{userProfile$.value.displayId}}/reactions"
              >
              View all of <strong>3</strong> user's reactions
            </a>
          </div>
        </div>
        <div>
          <div class="profile-card">
            <div 
              class="user-background" 
              style="background: url({{environment.imageHostUrl}}/users/cover/{{userProfile$.value.coverPhotoId}}.jpg)"
            ></div>
            <div class="user-bottom">
              <a 
                href="javascript:void(0);" 
                routerLink="/users/{{userProfile$.value.displayId}}/about"
              >
              <img 
                  src="{{environment.imageHostUrl}}/users/profile/{{userProfile$.value.profilePhotoId}}.jpg"
                  class="user-avatar"  
                  >
                </a>
                <a 
                href="javascript:void(0);" 
                routerLink="/users/{{userProfile$.value.displayId}}/about"
              >
              <h4 class="user-username">{{userProfile$.value.username}}</h4>
              </a>
              @if (userProfile$.value.id === reaction.userId) {
                <div class="reaction-button">
                  <button type="button">Hey, that's you!</button>
                </div>
              }
              @else {
                <div class="reaction-button-public">
                  <button type="button">Follow</button>
                </div>
              }
            </div>
          </div>
        </div>
      }
      @else {
        <h3>404</h3>
      }
    }
  </div>
</div>
