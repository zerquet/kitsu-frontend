@if (userProfile$ | async; as userProfile) {
  <div id="cover-section">
    <cover-photo></cover-photo>
    <primary-info></primary-info>
  </div>
  <nav-tabs [tabs]="tabs"></nav-tabs>
  <div id="profile-tab-content-container" class="container">
    @if (currentTab$ | async; as currentTab) {
      <!--since there's only 2, no need for a wrapper component like anime-->
      <!--can this be children routes?-->
      @if(currentTab === "about") {
        <user-about></user-about>
      }
      @else if(currentTab === "library") {
        <app-library></app-library>
      }
    }
  </div>
}
