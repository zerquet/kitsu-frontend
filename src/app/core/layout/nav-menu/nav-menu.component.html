<nav id="kitsu-nav" class="navbar navbar-expand-lg py-0">
  <div class="container">
    <a class="navbar-brand" routerLink="/explore">KITSU</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar-content"
      aria-controls="navbar-content" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbar-content">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        @if((this.authenticatedUser$ | async); as authenticatedUser) {
        <li class="nav-item">
          <a class="nav-link" href="javascript:void(0);" routerLink="/users/{{authenticatedUser.displayId}}/library"
            [class.active]="activeMenuItem === 'library'">Library</a>
        </li>
        }
        <li class="nav-item">
          <a class="nav-link" href="javascript:void(0);" routerLink="/explore"
            [class.active]="activeMenuItem === 'anime'">Anime</a>
        </li>
      </ul>
      <div>
        <!--An absolute positioned element will appear at the top-left corner of the parent element. So adding this <div> encapsulating the form and dropdown <div>
                    makes it so that the dropdown window doesn't appear on the top-left position of the nav-->
        <form id="nav-search-form" class="d-flex" role="search" [formGroup]="form">
          <i class="bi bi-search"></i>
          <input id="navbar-search-field" type="search" placeholder="Search" formControlName="searchControl">
        </form>
        @if(show$.value === true ) {
        <search-results [results$]="searchResults$"></search-results>
        }
      </div>
      <ul class="navbar-nav me-autp mb-2 mb-lg-0 ms-3">
        @if (this.authenticatedUser$ | async; as authenticatedUser) {
        <li class="nav-item profile-icon-container">
          <div class="dropdown pe-2">
            <a id="sort-options-btn" class="btn btn-sm dropdown-toggle" href="#" role="button"
              data-bs-toggle="dropdown">
              <div class="profile-icon">
                <!--may need to get auth user's profile on app start and set state from there-->
                <img [src]="authenticatedUser.profilePhotoUrl">
              </div>
            </a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item cursor" routerLink="/users/{{authenticatedUser.displayId}}/about">View
                  Profile</a></li>
              <li><a class="dropdown-item cursor" (click)="logout()">Logout</a></li>
            </ul>
          </div>
        </li>
        }
        @else {
        <li class="nav-item"><a class="nav-link cursor" (click)="openSignInModal()">Sign In</a></li>
        <li class="nav-item"><a class="nav-link cursor" (click)="openSignUpModal()">Sign Up</a></li>
        }
      </ul>
    </div>
  </div>
</nav>
<div id="nav-spacer"></div>
