@if (userProfile$ | async; as userProfile) {
@if (userProfile !== null) {
<div id="cover-user-info-section" class="container">
  <div id="cover-profile-picture">
    @if (userProfile.profilePhotoId === null) {
    <img src="https://media.kitsu.app/user/1523778/avatar/large-77089f27577b3c80b2f270125e0c85ee.jpeg"
      alt="Profile Picture">
    }
    @else {
    <img src="{{environment.imageHostUrl}}/users/profile/{{userProfile.profilePhotoId}}.jpg" alt="Profile Picture">
    }
  </div>
  <div id="mini-bio">
    <div id="cover-username">{{userProfile.username}}</div>
    <div id="cover-btn-container">
      @if(canEdit$ | async;) {
      <input (click)="onEditProfileClick()" type="button" id="edit-btn" value="Edit" />
      }
      @else {
      <input type="button" id="follow-btn" value="Follow">
      }
    </div>
  </div>
</div>
}
}
