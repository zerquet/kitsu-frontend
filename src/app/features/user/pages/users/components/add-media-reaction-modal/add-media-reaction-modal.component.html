@if(libraryEntry$ | async; as libraryEntry) {
  <div class="add-reaction-modal"
    style="background: url({{environment.imageHostUrl}}/anime/poster/{{libraryEntry.anime.imageUrl}})">
    <div class="add-reaction-background-overlay"></div>
    <div class="add-reaction-form-container">
      <div class="reaction-anime-name">
        <div>{{libraryEntry.anime.title}}</div>
        <div class="text-left" [class.invalid]="charsLeft === 140">{{charsLeft}}</div>
      </div>
      <form [formGroup]="addMediaReactionForm" (submit)="onSubmit()">
        <div>
          <textarea class="reaction-text-field" formControlName="reaction" maxlength="140"
            placeholder="Overrated, don't waste your time on this one." required></textarea>
        </div>
        <div class="post-reaction-container">
          <input type="submit" value="Post" [disabled]="!addMediaReactionForm.valid">
        </div>
      </form>
    </div>
  </div>
}
@else {
  <span>Sorry, could not load anime info :(</span>
}
