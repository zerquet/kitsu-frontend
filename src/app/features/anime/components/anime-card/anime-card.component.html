@if(anime !== undefined) {
  <a routerLink="/anime/{{anime.id}}/summary">
    <div
      class="anime-poster-image-container"
      (mouseenter)="onAnimePosterHover()"
      (mouseleave)="onAnimePosterHoverOut()">
        <img class="anime-poster-img" src="{{anime.imageUrl}}" />
    </div>
  </a>
}
@if(showTooltip) {
  <anime-card-tooltip [anime]="anime"></anime-card-tooltip>
}
@if(showCardTitle) {
  <div class="anime-poster-title">{{anime?.title}}</div>
}
