@if(anime !== undefined) {
  <div 
    class="anime-poster-image-container" 
    (mouseenter)="onAnimePosterHover()" 
    (mouseleave)="onAnimePosterHoverOut()" 
    routerLink="/anime/{{anime.id}}/summary"
    >
    <img class="anime-poster-img" src="{{environment.imageHostUrl}}/anime/poster/{{anime.imageUrl}}" />
  </div>
}
@if(showTooltip) {
  <anime-card-tooltip [anime]="anime"></anime-card-tooltip>
}
@if(showCardTitle) {
  <div>{{anime?.title}}</div>
}
