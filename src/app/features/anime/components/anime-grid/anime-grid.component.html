<div class="pt-4">
  @if(caption) {
    <div class="col-sm-12">
      <h6><strong>{{caption}}</strong></h6>
    </div>
  }
  <div class="d-flex flex-row flex-wrap">
    @for (anime of animes; track anime.id) {
      <anime-card [anime]="anime" [showCardTitle]="showCardTitle"></anime-card>
    }
  </div>
</div>
