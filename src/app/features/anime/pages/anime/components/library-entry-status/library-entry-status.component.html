<div id="sidebar-form">
  <!--New library entry or user logged out-->
  @if(this.libraryEntry$.getValue() === null || !(this.authService.authenticatedUser$ | async);) {
    <span id="sidebar-heading"><span>Add to Library</span></span>
    <div id="sidebar-container">
      <div>
        <input class="sidebar-watch-status-btn mb-2" id="green-action-btn" type="button" value="Completed"
          (click)="onAddToLibraryClick('completed')" />
      </div>
      <div>
        <input class="sidebar-watch-status-btn mb-2" id="blue-action-btn" type="button" value="Want to Watch"
          (click)="onAddToLibraryClick('planning')" />
      </div>
      <div>
        <input class="sidebar-watch-status-btn mb-2" id="purple-action-btn" type="button" value="Started Watching"
          (click)="onAddToLibraryClick('watching')" />
      </div>
    </div>
  }
  <!-- Anime is in library -->
  @else if (this.libraryEntry$.getValue()?.watchStatus === 'completed') {
    <span id="sidebar-heading"><span>Update Library</span></span>
    <div id="sidebar-container">
      <div class="saved-in-library"><span>Saved in <a href="">Completed</a></span></div>
      <div>
        <input class="sidebar-watch-status-btn mb-2" id="blue-action-btn" type="button" value="Add Rating"
          (click)="onAddToLibraryClick('planning')" />
      </div>
      <div>
        <input class="sidebar-watch-status-btn mb-2" id="green-action-btn" type="button" value="Post Reaction" 
          (click)="onAddToLibraryClick('watching')" />
      </div>
      <div class="edit-library-entry"><span (click)="onEditLibraryEntryClick()">Edit Library Entry</span></div>
    </div>
  }
</div>
