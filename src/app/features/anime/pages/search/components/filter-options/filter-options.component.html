<div class="mt-3 filter-option">
  <filter-values [filter]="'Year'" [min]="minYearPillValue" [max]="maxYearPillValue"></filter-values>
  <div>
    <mat-slider [min]="minYear" [max]="maxYear" [disableRipple]="true" step="1">
      <input 
        matSliderStartThumb 
        (change)="onSliderChange($event, 'minYear$')" 
        (input)="onSliderInput($event, 'minYearPillValue')"
        [value]="minYear" 
      /> 
      <input 
        matSliderEndThumb 
        (change)="onSliderChange($event, 'maxYear$')" 
        (input)="onSliderInput($event, 'maxYearPillValue')"
        [value]="maxYear" 
      />
    </mat-slider>
  </div>
  <filter-legend [min]="minYearPillValue" [max]="maxYearPillValue"></filter-legend>
</div>
<div class="filter-option">
  <filter-values [filter]="'Average Rating'" [min]="minRatingPillValue" [max]="maxRatingPillValue"></filter-values>
  <div>
    <mat-slider [min]="minRating" [max]="maxRating" [disableRipple]="true" step="1">
      <input 
        matSliderStartThumb 
        (change)="onSliderChange($event, 'minRating$')" 
        (input)="onSliderInput($event, 'minRatingPillValue')"
        [value]="minRating" 
      />
      <input 
        matSliderEndThumb 
        (change)="onSliderChange($event, 'maxRating$')" 
        (input)="onSliderInput($event, 'maxRatingPillValue')"
        [value]="maxRating" 
      />
    </mat-slider>
  </div>
  <filter-legend [min]="minRatingPillValue + '%'" [max]="maxRatingPillValue + '%'"></filter-legend>
</div>
<div class="filter-option">
  <filter-values [filter]="'Episodes'" [min]="minEpisodesPillValue" [max]="maxEpisodesPillValue"></filter-values>
  <div>
    <mat-slider [min]="minEps" [max]="maxEps" [disableRipple]="true" step="1">
      <input 
        matSliderStartThumb 
        (change)="onSliderChange($event, 'minEpisodes$')" 
        (input)="onSliderInput($event, 'minEpisodesPillValue')"
        [value]="minEps" 
      />
      <input 
        matSliderEndThumb 
        (change)="onSliderChange($event, 'maxEpisodes$')" 
        (input)="onSliderInput($event, 'maxEpisodesPillValue')"
        [value]="maxEps" 
      />
    </mat-slider>
  </div>
  <filter-legend [min]="minEpisodesPillValue" [max]="maxEpisodesPillValue + '+'"></filter-legend>
</div>
<div class="filter-option">
  <fieldset>
    <filter-values [filter]="'Types'" [max]="'2'"></filter-values>
    <div class="checkbox-field">
      <input id="type-tv" type="checkbox" [checked]="tvChecked$.value" (change)="onToggleMediaType('isTv$')">
      <label for="type-tv" class="ps-2">TV</label>
    </div>
    <div class="checkbox-field">
      <input id="type-movie" type="checkbox" [checked]="movieChecked$.value" (change)="onToggleMediaType('isMovie$')">
      <label for="type-movie" class="ps-2">Movie</label>
    </div>
  </fieldset>
</div>
