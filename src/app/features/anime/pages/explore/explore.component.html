<div class="container">
  <div class="row">

    <!--75%-->
    <div class="col-sm-9">
      <div class="row">
        @if(category$ | async; as category) {
          <category-summary [category]="category" class="col-sm-12"></category-summary>
        }
        <main-search class="col-sm-12"></main-search>
      </div>
      @if(animes$ | async; as animes) {
        <anime-grid [animes]="animes.highestRatedAnime" [caption]="'Highest Rated Anime'" class="row"></anime-grid>
        <view-more-link></view-more-link>

        <anime-grid [animes]="animes.newAnime" [caption]="'New Anime'" class="row"></anime-grid>
        <view-more-link></view-more-link>

        <anime-grid [animes]="animes.popularAnime" [caption]="'Most Popular Anime'" class="row"></anime-grid>
        <view-more-link></view-more-link>
      }
    </div>

    <!--25%-->
    @if(categories$ | async; as categories) {
      <category-list [categories]="categories" class="col-sm-3"></category-list>
    }
    
  </div>
</div>
