<header class="admin-page-header">
  <div>
    <div class="admin-breadcrumb"><a routerLink="../../episodes">Episodes</a><i class="bi bi-chevron-right"></i>New</div>
    <h1>Add Episode</h1>
  </div>
</header>

<form class="admin-card" [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="admin-form-body single">
    <section>
      <div class="admin-field">
        <label for="matchingAnime">Anime</label>
        @if (selectedAnime !== null) {
          <div class="admin-selected-pill">
            <span>{{selectedAnime.title}}</span>
            <button class="admin-icon-btn danger" title="Clear selected anime" (click)="deselectAnime()" type="button"><i class="bi bi-x-lg"></i></button>
          </div>
        }
        @else {
          <div class="admin-autocomplete">
            <input class="admin-input" formControlName="matchingAnime" id="matchingAnime" type="text" placeholder="Search anime..." autocomplete="off">
            @if (show) {
              @if (animeResults$ | async; as animeResults) {
                <div class="admin-autocomplete-menu">
                  @for (anime of animeResults; track anime.id) {
                    <button class="admin-autocomplete-item" type="button" (click)="selectAnimeForEpisodeAddition(anime)">
                      <img src="{{environment.imageHostUrl}}/anime/poster/{{anime.imageUrl}}" alt="">
                      {{anime.title}}
                    </button>
                  }
                  @empty {
                    <div class="admin-autocomplete-empty">No results found.</div>
                  }
                </div>
              }
            }
          </div>
        }
      </div>

      <div class="admin-field-row">
        <div class="admin-field">
          <label for="epNumber">Episode Number</label>
          <input class="admin-input" formControlName="epNumber" id="epNumber" type="number" min="0">
        </div>
        <div class="admin-field">
          <label for="airDate">Air Date</label>
          <input class="admin-input" formControlName="airDate" id="airDate" type="date">
        </div>
      </div>

      <div class="admin-field">
        <label for="title">Title</label>
        <input appTrim class="admin-input" formControlName="title" id="title" type="text">
      </div>

      <div class="admin-field">
        <label for="japaneseTitle">Title (Japanese)</label>
        <input appTrim class="admin-input" formControlName="japaneseTitle" id="japaneseTitle" type="text">
      </div>

      <div class="admin-field">
        <label for="description">Description</label>
        <textarea appTrim class="admin-input" formControlName="description" id="description" rows="6"></textarea>
      </div>
    </section>
  </div>

  <div class="admin-form-footer">
    <a class="admin-btn admin-btn-secondary" routerLink="../../episodes">Cancel</a>
    <button class="admin-btn admin-btn-primary" type="submit" [disabled]="!form.valid">Add Episode</button>
  </div>
</form>
