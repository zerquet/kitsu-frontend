<header class="admin-page-header">
  <div>
    <div class="admin-breadcrumb"><a routerLink="../../franchises">Franchises</a><i class="bi bi-chevron-right"></i>New</div>
    <h1>Add Franchise</h1>
  </div>
</header>

<form class="admin-card" [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="admin-form-body single">
    <section>
      <div class="admin-field">
        <label for="name">Name</label>
        <input appTrim class="admin-input" [class.invalid]="name?.invalid && (name?.dirty || name?.touched)"
          formControlName="name" id="name" type="text">
        @if (name?.hasError('required') && (name?.dirty || name?.touched)) {
          <span class="admin-field-error">Name is required.</span>
        }
      </div>
    </section>
  </div>

  <div class="admin-form-footer">
    <a class="admin-btn admin-btn-secondary" routerLink="../../franchises">Cancel</a>
    <button class="admin-btn admin-btn-primary" type="submit" [disabled]="!form.valid">Add Franchise</button>
  </div>
</form>
