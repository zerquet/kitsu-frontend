<header class="admin-page-header">
  <h1>Franchises</h1>
  <div class="admin-toolbar">
    <form class="admin-search" [formGroup]="form">
      <i class="bi bi-search"></i>
      <input class="admin-input" type="search" formControlName="searchControl" placeholder="Search franchises...">
    </form>
    <button class="admin-btn admin-btn-primary" type="button" routerLink="../add/franchise"><i class="bi bi-plus-lg"></i>Add Franchise</button>
  </div>
</header>

<div class="admin-card">
  <table class="admin-table">
    <thead>
      <tr>
        <th>Franchise</th>
        <th class="col-actions">Actions</th>
      </tr>
    </thead>
    <tbody>
      @if (filteredSearchList$ | async; as searchList) {
        @for (franchise of searchList; track franchise.id) {
          <tr>
            <td class="admin-table-title">{{franchise.name}}</td>
            <td class="col-actions">
              <button class="admin-icon-btn danger" type="button" title="Delete" (click)="deleteFranchise(franchise.id!)"><i class="bi bi-trash3"></i></button>
            </td>
          </tr>
        }
        @empty {
          <tr><td class="admin-empty" colspan="2">No franchises found.</td></tr>
        }
      }
    </tbody>
  </table>
</div>
