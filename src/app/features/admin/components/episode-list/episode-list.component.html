<header class="admin-page-header">
  <h1>Episodes</h1>
  <div class="admin-toolbar">
    <form class="admin-search" [formGroup]="form">
      <i class="bi bi-search"></i>
      <input class="admin-input" type="search" formControlName="searchControl" placeholder="Search episodes...">
    </form>
    <button class="admin-btn admin-btn-primary" type="button" routerLink="../add/episode"><i class="bi bi-plus-lg"></i>Add Episode</button>
  </div>
</header>

<div class="admin-card">
  <table class="admin-table">
    <thead>
      <tr>
        <th class="col-narrow">Episode</th>
        <th>Title</th>
        <th class="col-actions">Actions</th>
      </tr>
    </thead>
    <tbody>
      @if (filteredSearchList$ | async; as searchList) {
        @for (episode of searchList; track episode.id) {
          <tr>
            <td class="col-narrow">{{episode.number}}</td>
            <td class="admin-table-title">{{episode.title}}</td>
            <td class="col-actions">
              <button class="admin-icon-btn danger" type="button" title="Delete" (click)="deleteEpisode(episode.id!)"><i class="bi bi-trash3"></i></button>
            </td>
          </tr>
        }
        @empty {
          <tr><td class="admin-empty" colspan="3">No episodes found.</td></tr>
        }
      }
    </tbody>
  </table>
</div>
