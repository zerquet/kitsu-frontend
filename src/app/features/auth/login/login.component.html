<div class="modal-body">
  <modal-title title="Welcome back!"></modal-title>
    <p>Login to your Kitsu Clone account below. If you need an account, create one</p>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <input id="email" placeholder="Email" formControlName="email" />
        <input id="password" placeholder="Password" formControlName="password" type="password"/>
        <div id="forgot-password-label"><a><small>forgot password?</small></a></div>
      </div>
      <button id="login-btn" type="submit" [disabled]="!loginForm.valid">Login</button>
    </form>
</div>
