<div class="mt-3 filter-option">
  <filter-values [filter]="'Year'" [min]="minYearPillValue" [max]="maxYearPillValue"></filter-values>
  <div>
    <mat-slider min="1975" max="2025" [disableRipple]="true" step="1">
      <input 
        matSliderStartThumb 
        (change)="onSliderChange($event, 'minYear$')" 
        (input)="onSliderInput($event, 'minYearPillValue')"
        value="1975" 
      /> 
      <input 
        matSliderEndThumb 
        (change)="onSliderChange($event, 'maxYear$')" 
        (input)="onSliderInput($event, 'maxYearPillValue')"
        value="2025" 
      />
    </mat-slider>
  </div>
  <filter-legend [min]="'1975'" [max]="'2025'"></filter-legend>
</div>
<div class="filter-option">
  <filter-values [filter]="'Average Rating'" [min]="minRatingPillValue" [max]="maxRatingPillValue"></filter-values>
  <div>
    <mat-slider min="5" max="100" [disableRipple]="true" step="1">
      <input 
        matSliderStartThumb 
        (change)="onSliderChange($event, 'minRating$')" 
        (input)="onSliderInput($event, 'minRatingPillValue')"
        value="5" 
      />
      <input 
        matSliderEndThumb 
        (change)="onSliderChange($event, 'maxRating$')" 
        (input)="onSliderInput($event, 'maxRatingPillValue')"
        value="100" 
      />
    </mat-slider>
  </div>
  <filter-legend [min]="'5%'" [max]="'100%'"></filter-legend>
</div>
<div class="filter-option">
  <filter-values [filter]="'Episodes'" [min]="minEpisodesPillValue" [max]="maxEpisodesPillValue"></filter-values>
  <div>
    <mat-slider min="1" max="100" [disableRipple]="true" step="1">
      <input 
        matSliderStartThumb 
        (change)="onSliderChange($event, 'minEpisodes$')" 
        (input)="onSliderInput($event, 'minEpisodesPillValue')"
        value="1" 
      />
      <input 
        matSliderEndThumb 
        (change)="onSliderChange($event, 'maxEpisodes$')" 
        (input)="onSliderInput($event, 'maxEpisodesPillValue')"
        value="100" 
      />
    </mat-slider>
  </div>
  <filter-legend [min]="'1'" [max]="'100+'"></filter-legend>
</div>
<div class="filter-option">
  <fieldset>
    <filter-values [filter]="'Types'" [max]="'2'"></filter-values>
    <div>
      <input 
        [checked]="tvChecked$.value" 
        (change)="onToggleMediaType('isTv$')" 
        type="checkbox"
      />
      <label class="ps-2">TV</label>
    </div>
    <div>
      <input 
        [checked]="movieChecked$.value" 
        (change)="onToggleMediaType('isMovie$')" 
        type="checkbox"
      />
      <label class="ps-2">Movie</label>
    </div>
  </fieldset>
</div>
